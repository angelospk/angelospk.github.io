- id: greek-council-asr
  title: Greek Council Speech Recognition
  subtitle: Greek speech recognition with reproducible evaluation
  type: open-source
  category: ai
  weight: 10
  period:
    start: 2026-05
    end: 2026-08
  description: >-
    Fewer hand corrections for the volunteers who review Greek council transcripts: a
    Whisper LoRA model trained and published for OpenCouncil during Google Summer of
    Code 2026. Built the evaluation that decides whether a new model earns its place in
    production. Deliverable submitted in August 2026; research continues.
  context:
    problem: Council transcripts need human correction. Model changes must preserve
      speech and be evaluated consistently before they can justify a change to the
      transcription workflow.
    solution: Curated correction pairs, trained Whisper LoRA adapters, built a review
      interface and compared systems on fixed audio through a controlled decoder.
      The August 23 held-out evaluation covered 391 windows from 117 meetings. The
      newer adapter reduced deletion rate from 0.0525 to 0.0313, but its WER difference
      of -0.0040 had a 95% confidence interval crossing zero, so it was not promoted.
  highlights:
  - text: >-
      Cut the deletion rate on held-out council audio from 5.25% to 3.13% (391 windows,
      117 meetings) with a new adapter, and reported the overall WER change as
      inconclusive rather than overselling it.
  - text: >-
      Published a Whisper LoRA model and built reproducible evaluation with fixed audio,
      model hashes and meeting-clustered confidence intervals.
  - text: >-
      Kept the incumbent adapter when the replacement failed its predeclared promotion
      rule; documented the tradeoff between deletions, insertions and substitutions.
  - text: >-
      Built dataset review tooling and a GPU serving path with word timestamps and
      model-version metadata.
  links:
  - url: https://huggingface.co/opencouncil/whisper-large-v3-el-council-lora
    label: Model
  - url: https://github.com/eellak/gsoc2026-opencouncil-stt
    label: GitHub
  technologies:
  - Python
  - Whisper
  - LoRA / PEFT
  - PyTorch
  - CTranslate2
  - Serverless GPU
  - Statistical evaluation
  featured: true


- id: "brain"
  title: "Brain"
  subtitle: "Local-first second brain with retrieval over your own notes"
  type: "personal"
  category: "ai"
  weight: 9
  period:
    start: "2026"
    end: null
  description: >-
    A personal knowledge system where spoken brain-dumps and dropped files become
    Markdown notes that stay the source of truth, readable in Obsidian and queryable in
    natural language. Local embeddings index the notes. It answers chronology-aware
    questions like "what occupied me last week", extracts the tasks hiding inside a
    ramble, and asks before it acts on any of them.
  context:
    problem: |
      Note apps store text but cannot answer questions about it, and cloud assistants
      that can answer want the whole private archive uploaded first. Neither reads a
      voice transcript and turns it into what actually needs doing.
    solution: |
      Built a Python system where capture, extraction, retrieval and dispatch are
      separate stages over plain Markdown. Embeddings run locally against a LanceDB
      index; the chat layer routes through a fallback chain of cloud backends so a
      low-RAM machine is never forced to load a local model. Extracted actions are
      proposed, not executed, and reach Apple Reminders or Telegram only after
      approval.
  highlights:
    - text: "Your files stay yours"
      detail: "Markdown notes in a normal folder are the source of truth. The index is derived and can be rebuilt from scratch."
    - text: "Retrieval that knows about time"
      detail: "Local embeddings plus contextual retrieval and generated maps of content, so questions about a period answer from what was actually written then."
    - text: "Voice to task, with a human gate"
      detail: "Transcripts are cleaned, actions are extracted with due dates, and each one is approved through a Telegram bot before it becomes a real reminder."
    - text: "Claims get checked"
      detail: "Factual claims pulled from entries are verified against live web sources and recorded with a verdict, instead of being trusted because they were said out loud."
    - text: "Built to be maintained"
      detail: "111 test modules, an entity and person graph, and 15 shipped phases planned as a decision register rather than a backlog."
  technologies:
    - "Python"
    - "LanceDB"
    - "Local embeddings (Ollama)"
    - "RAG"
    - "LLM routing"
    - "Telegram Bot API"
    - "pytest"
  featured: true

- id: "codex-bridge"
  title: "Codex Bridge"
  subtitle: "Safe orchestration layer for a second coding agent"
  type: "personal"
  category: "automation"
  weight: 8
  period:
    start: "2026"
    end: null
  description: |
    Infrastructure that lets one coding agent hand work to another without either of
    them being able to reach past the boundary it was given. A queue, a worker and a
    single policy module decide which model runs, what it is allowed to write, how
    long it gets and whether the budget can afford it. Over 1,000 jobs have gone
    through it.
  context:
    problem: |
      Calling a second agent directly from a shell means an unbounded process that can
      hang the session, write wherever the config happens to allow, and burn quota
      with nobody watching. A review job that silently gained write access to the repo
      it was reviewing is the failure that started this.
    solution: |
      Every job goes through a client that enqueues and a worker that runs it under an
      explicitly passed sandbox. Reasoning effort selects the model and the time budget
      together, so no caller can assemble a combination nobody designed. Write access
      exists only inside a declared lane, arguments are an allowlist rather than a
      denylist, and what the job touched is verified against a git baseline taken at
      enqueue time.
  highlights:
    - text: "Fails closed by design"
      detail: "Read-only sandbox is passed explicitly on every job, since inheriting it from config is how a review once wrote to disk. Unknown flags reject the job instead of being forwarded."
    - text: "Never hangs the caller"
      detail: "Two-phase waiting that only times out when the queue stops moving, bounded concurrency of three reads and one write, and a stop hook that refuses to end a session with its own job still running."
    - text: "Spends nothing it should not"
      detail: "A usage gate reads the live quota windows before enqueueing and refuses on unclassified or incomplete usage data rather than guessing there is room."
    - text: "Scope is measured, not promised"
      detail: "Post-job verification compares the changed files against the declared allowlist using a baseline from the enqueue moment, so concurrent human edits are never blamed on the agent."
    - text: "4,800 lines of tests"
      detail: "Eight test modules covering policy resolution, sandbox confinement, offload gating, watch delivery and the pending-work hook."
  technologies:
    - "Python"
    - "SQLite"
    - "Job queue / worker"
    - "Sandboxing"
    - "Agent orchestration"
    - "pytest"
  featured: true

- id: roomly
  title: Roomly
  subtitle: Shared-household hub for money, chores and the calendar
  type: personal
  category: fullstack
  weight: 9
  period:
    start: '2026'
    end: 
  description: >-
    Takes shared bills and chores out of the group chat: housemates record who paid,
    settle a debt only when the other side confirms, and see chores, events and open
    bills on one calendar. Splits must balance to the cent, enforced in Postgres.
  context:
    problem: |
      Shared expenses live in a group chat and a half-remembered mental ledger. Chores
      rotate until somebody stops believing it is fair. Every existing app solves one
      of these and asks the household to install three.
    solution: |
      One app with expenses, chores, calendar and shopping in the same account.
      Splits must balance to the cent or the write is rejected by Postgres, a
      settlement is only recorded when the person who received the money confirms it,
      and recurring expenses are generated by a scheduled idempotent job instead of
      being retyped monthly.
  highlights:
  - text: Invariants in the database
    detail: Row-level security plus constraints that make unequal splits balance and
      stop a debt being settled twice, so no client path can write an inconsistent
      ledger.
  - text: Settlement needs both sides
    detail: Either flatmate can record a payment, but it only closes when the recipient
      confirms it, which is the part every splitting app leaves to trust.
  - text: Chores that stay fair
    detail: Assignment, recurrence and rotation with a weekly leaderboard, so the
      rota is visible rather than remembered.
  - text: Greek and English throughout
    detail: Full i18n including date and currency formatting and due-date wording,
      tested per locale.
  - text: Designed, not themed
    detail: A cream and ink visual system built on semantic design tokens, replacing
      brand-specific utility classes so components carry meaning instead of a colour
      name.
  technologies:
  - TypeScript
  - React
  - TanStack Start
  - Supabase / PostgreSQL
  - Row-Level Security
  - pg_cron
  - Tailwind CSS
  - i18next
  featured: true


