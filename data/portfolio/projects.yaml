- id: find-doctors-server
  title: FindDoctors Aggregator Server
  subtitle: Public appointment discovery across health providers
  type: personal
  category: backend
  weight: 10
  period:
    start: '2026'
    end: 
  description: >-
    Finds the earliest public-health appointment in one search instead of one provider
    at a time, across hospitals and primary-care centres on finddoctors.gov.gr. A Go
    service ranks results by soonest slot and distance; booking stays on the official
    portal, and live searches need an authenticated upstream session.
  context:
    problem: People need to compare availability across provider types and regions
      without repeating each search manually.
