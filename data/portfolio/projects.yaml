  - text: Built a concurrent Go API with bounded fan-out, retries and Prometheus metrics
      for upstream failures.
  - text: Added a Greek search interface with specialty, location and distance filters,
      served directly from the Go binary.
  - text: Kept failed availability checks visible with scanOk and a null date, so
      an outage is not reported as no appointments.
  - text: Documented the session-bridge dependency and deprecated an endpoint whose
      upstream returned no useful results.
  links:
