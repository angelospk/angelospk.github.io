  email: "angelos.papamichail@gmail.com"
  tagline: "Software Engineer | Applied AI & Business Automation"
  location: "Thessaloniki, Greece"
  
  # Short summary - will be used for CV headers
  summary: |
    Software engineer (MEng Electrical and Computer Engineering) who builds tools for everyday operations: online bookings and payments, appointment search, ERP data entry, transcript review and digital-skills training. Python, Go and TypeScript, from requirements to deployment. Google Summer of Code 2026 contributor and OpenCouncil maintainer.

  # Longer about text - for the website
  about: |
    I build software around the work people need to get done. At an agricultural
    cooperative, that meant automating repeated ERP data entry and documenting
    procedures for staff. For UniTrip, it meant booking, payment and back-office
    workflows that a travel business could operate.

    My recent work includes Greek speech-recognition research for OpenCouncil,
    a photo-to-embroidery desktop workflow and interactive digital-skills lessons
    for older adults. I care about the handover as much as the implementation:
    someone should be able to use the result and understand its limits.

    Outside software, I teach digital skills, subtitle films, play piano and swim.

