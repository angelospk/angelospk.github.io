{{ with .Site.Data.pillars }}
<div class="pillars">
  <h2>What I build</h2>
  <div class="pillars-grid">
    {{ range . }}
    <div class="pillar">
      <h3>{{ .title }}</h3>
      <p>{{ .blurb }}</p>
      <ul>
        {{ range .projects }}
        <li><a href="{{ if hasPrefix .url "/" }}{{ .url | relURL }}{{ else }}{{ .url }}{{ end }}">{{ .name }}</a></li>
        {{ end }}
      </ul>
    </div>
    {{ end }}
  </div>
  <p class="pillars-more"><a href="{{ "projects/" | relURL }}">All projects</a> · <a href="{{ "about/" | relURL }}">About</a> · <a href="{{ "cv/" | relURL }}">CV</a></p>
</div>
<style>
  section.container.centered { flex-wrap: wrap; }
  .pillars { flex: 0 0 100%; margin: 4rem auto 0; max-width: 90rem; text-align: left; }
  .pillars h2 { text-align: center; font-size: 2.4rem; margin-bottom: 2rem; }
  .pillars-grid { display: grid; gap: 1.6rem; grid-template-columns: repeat(auto-fit, minmax(24rem, 1fr)); }
  .pillar { border: 1px solid rgba(127,127,127,.3); border-radius: .8rem; padding: 1.6rem 1.8rem; }
  .pillar h3 { margin: 0 0 .6rem; font-size: 1.9rem; }
  .pillar p { margin: 0 0 1rem; font-size: 1.5rem; line-height: 1.5; opacity: .85; }
  .pillar ul { margin: 0; padding-left: 1.8rem; font-size: 1.5rem; }
  .pillars-more { text-align: center; margin-top: 2rem; }
</style>
{{ end }}
